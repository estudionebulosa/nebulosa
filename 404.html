<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>404 — Nebulosa Estudio</title>
<meta name="robots" content="noindex">
<style>
*,*::before,*::after{box-sizing:border-box}*{margin:0}
:root{color-scheme:light dark;--bg:#0a0a14;--fg:#e8e8f0;--accent:#8b5cf6;--accent-2:#ec4899}
@media(prefers-color-scheme:light){:root{--bg:#fafafc;--fg:#0a0a14}}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh;display:grid;place-items:center;padding:2rem;text-align:center;
  background-image:radial-gradient(60% 80% at 20% 0%,rgba(139,92,246,.18),transparent 60%),radial-gradient(50% 60% at 90% 20%,rgba(34,211,238,.10),transparent 60%);
}
.box{max-width:32rem}
h1{font-size:clamp(4rem,18vw,8rem);font-weight:800;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(120deg,var(--accent) 0%,var(--accent-2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:1rem}
h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;letter-spacing:-.02em;margin-bottom:.75rem}
p{opacity:.75;margin-bottom:2rem;line-height:1.6}
a{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.4rem;border-radius:999px;
  background:var(--fg);color:var(--bg);text-decoration:none;font-weight:600;transition:transform .2s}
a:hover{transform:translateY(-1px)}
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Esta ruta no existe</h2>
    <p>Es posible que la página haya cambiado de nombre o que nunca haya existido. Vuelve al inicio y seguimos.</p>
    <a href="/">← Volver al inicio</a>
  </div>
</body>
</html>
